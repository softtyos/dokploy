version: '3.8'

services:
  dokploy:
    image: softtynet/dokploy:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://dokploy:dokploy@postgres:5432/dokploy
      - REDIS_URL=redis://redis:6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dokploy-data:/app/data
    depends_on:
      - postgres
      - redis

  monitoring:
    image: softtynet/monitoring:latest
    container_name: dokploy-monitoring
    restart: unless-stopped
    ports:
      - "4500:4500"
    environment:
      - 'METRICS_CONFIG={"server":{"type":"Dokploy","refreshRate":20,"port":4500,"token":"metrics","retentionDays":7,"cronJob":"0 0 * * *","urlCallback":"http://dokploy:3000/api/trpc/notification.receiveNotification","thresholds":{"cpu":0,"memory":0}},"containers":{"refreshRate":20,"services":{"include":[],"exclude":[]}}}'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/etc/os-release:ro
      - /proc:/host/proc:ro
      - monitoring-data:/app
    depends_on:
      - dokploy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dokploy
      POSTGRES_PASSWORD: dokploy
      POSTGRES_DB: dokploy
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

volumes:
  dokploy-data:
  postgres-data:
  redis-data:
  monitoring-data:
